<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sight Word Fun+</title><style>body{font-family:Arial;margin:0;background:linear-gradient(135deg,#4facfe,#8e44ad);padding:12px}.card{background:#fff;border-radius:20px;padding:16px;margin:10px auto;max-width:900px}h1{text-align:center;color:white}#word{min-height:180px;display:flex;align-items:center;justify-content:center;font-size:clamp(60px,18vw,140px);font-weight:bold}.btn{padding:12px 16px;border:none;border-radius:12px;margin:4px;color:#fff;font-weight:bold}.g{background:#28a745}.r{background:#e74c3c}.b{background:#3498db}.o{background:#f39c12}input,select{width:100%;padding:10px;box-sizing:border-box}</style></head><body><h1>🌟 Sight Word Fun Plus 🌟</h1><div class=card><div id=word>ready?</div><button class="btn b" onclick="showWord()">Show Word</button><button class="btn g" onclick="startCycle()">Start</button><button class="btn r" onclick="stopCycle()">Stop</button></div><div class=card>On Time <input id=onTime type=number value=6> Off Time <input id=offTime type=number value=2></div><div class=card><input id=newWord autocapitalize=none placeholder='type word'><button class="btn o" onclick="addWord()">Add Word</button><select id=wordList size=8></select><button class="btn r" onclick="hideWord()">Hide Selected Word</button></div><script>let words=['see','it','an','and','he','little','have','to','all','my','I','for','go','we','is','like','can','the','am'];const c=['#ff6b35','#e91e63','#2196f3','#4caf50'];let cycle=false,t;function refresh(){let s=document.getElementById('wordList');s.innerHTML='';words.forEach(w=>{let o=document.createElement('option');o.text=o.value=w;s.add(o);});}function showWord(){word.style.color=c[Math.floor(Math.random()*c.length)];word.textContent=words[Math.floor(Math.random()*words.length)];}function run(){if(!cycle)return;let on=(+onTime.value||6)*1000,off=(+offTime.value||2)*1000;showWord();t=setTimeout(()=>{word.textContent='⭐';t=setTimeout(run,off)},on)}function startCycle(){cycle=true;clearTimeout(t);run()}function stopCycle(){cycle=false;clearTimeout(t)}function addWord(){let w=newWord.value.trim().toLowerCase();if(w&&!words.includes(w)){words.push(w);refresh();}newWord.value='';}function hideWord(){let v=wordList.value;words=words.filter(x=>x!==v);refresh();}refresh();</script></body></html>
